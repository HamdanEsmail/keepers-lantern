<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>The Keeper's Lantern</title>
        <style>
            html, body { margin: 0; height: 100%; overflow: hidden; background: #24372d; }
            /* Phaser centres the game itself (autoCenter in main.js), so this only needs to fill the window. */
            #game { height: 100%; }
            #game canvas { display: block; }
        </style>
    </head>
    <body>
        <main id="game"></main>
        <!-- Panels (the camp, the morning) appear here, over the game. See src/ui/overlay.js. -->
        <section id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" hidden></section>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
