<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Controls: WASD or arrows to walk, E to use, Shift to run, Space to flare, T torch, F eat, J journal, M sound"><title>Controls: WASD or arrows to walk, E to use, Shift to run, Space to flare, T torch, F eat, J journal, M sound</title><style>
text{font-family:Georgia, 'Times New Roman', serif}
.sway{transform-box:fill-box;transform-origin:50% 92%;animation:sway 4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
.flick{transform-box:fill-box;transform-origin:center;animation:flick .9s ease-in-out infinite alternate}
.flick2{transform-box:fill-box;transform-origin:center;animation:flick 1.3s ease-in-out infinite alternate-reverse}
@keyframes flick{from{transform:scale(.965)}to{transform:scale(1.035)}}
.flame{transform-box:fill-box;transform-origin:50% 80%;animation:flame .32s ease-in-out infinite alternate}
@keyframes flame{from{transform:scaleY(.95) scaleX(1.02)}to{transform:scaleY(1.05) scaleX(.98)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.ff{animation:ff 6s ease-in-out infinite}
@keyframes ff{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}50%{opacity:.25;transform:translate(14px,-18px)}80%{opacity:1;transform:translate(-8px,-30px)}100%{opacity:0;transform:translate(4px,-44px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.key{animation:press 11s infinite}@keyframes press{0%,100%{transform:translateY(0)}1.5%,4%{transform:translateY(4px)}6%{transform:translateY(0)}}.lit{animation:lit 11s infinite}@keyframes lit{0%,7%,100%{opacity:0}1.5%,4%{opacity:.9}}</style><defs><clipPath id="card"><rect width="1280" height="320" rx="22"/></clipPath></defs><rect width="1280" height="320" rx="22" fill="#111c16"/><rect x="110" y="65" width="62" height="62" rx="12" fill="#050a07" opacity=".6"/><g class="key" style="animation-delay:0s"><rect x="110" y="56" width="62" height="62" rx="12" fill="#a8916a"/><rect x="115" y="59" width="52" height="48" rx="9" fill="#f3e7c9"/><rect class="lit" opacity="0" style="animation-delay:0s" x="115" y="59" width="52" height="48" rx="9" fill="#ffcf7a"/><text x="141" y="91.6" font-size="24" fill="#2a1e14" text-anchor="middle" font-weight="normal">W</text></g><rect x="40" y="135" width="62" height="62" rx="12" fill="#050a07" opacity=".6"/><g class="key" style="animation-delay:0.5s"><rect x="40" y="126" width="62" height="62" rx="12" fill="#a8916a"/><rect x="45" y="129" width="52" height="48" rx="9" fill="#f3e7c9"/><rect class="lit" opacity="0" style="animation-delay:0.5s" x="45" y="129" width="52" height="48" rx="9" fill="#ffcf7a"/><text x="71" y="161.6" font-size="24" fill="#2a1e14" text-anchor="middle" font-weight="normal">A</text></g><rect x="110" y="135" width="62" height="62" rx="12" fill="#050a07" opacity=".6"/><g class="key" style="animation-delay:1.0s"><rect x="110" y="126" width="62" height="62" rx="12" fill="#a8916a"/><rect x="115" y="129" width="52" height="48" rx="9" fill="#f3e7c9"/><rect class="lit" opacity="0" style="animation-delay:1.0s" x="115" y="129" width="52" height="48" rx="9" fill="#ffcf7a"/><text x="141" y="161.6" font-size="24" fill="#2a1e14" text-anchor="middle" font-weight="normal">S</text></g><rect x="180" y="135" width="62" height="62" rx="12" fill="#050a07" opacity=".6"/><g class="key" style="animation-delay:1.5s"><rect x="180" y="126" width="62" height="62" rx="12" fill="#a8916a"/><rect x="185" y="129" width="52" height="48" rx="9" fill="#f3e7c9"/><rect class="lit" opacity="0" style="animation-delay:1.5s" x="185" y="129" width="52" height="48" rx="9" fill="#ffcf7a"/><text x="211" y="161.6" font-size="24" fill="#2a1e14" text-anchor="middle" font-weight="normal">D</text></g><rect x="300" y="135" width="62" height="62" rx="12" fill="#050a07" opacity=".6"/><g class="key" style="animation-delay:2.6s"><rect x="300" y="126" width="62" height="62" rx="12" fill="#a8916a"/><rect x="305" y="129" width="52" height="48" rx="9" fill="#f3e7c9"/><rect class="lit" opacity="0" style="animation-delay:2.6s" x="305" y="129" width="52" height="48" rx="9" fill="#ffcf7a"/><text x="331" y="161.6" font-size="24" fill="#2a1e14" text-anchor="middle" font-weight="normal">E</text></g><rect x="420" y="135" width="110" height="62" rx="12" fill="#050a07" opacity=".6"/><g class="key" style="animation-delay:3.6s"><rect x="420" y="126" width="110" height="62" rx="12" fill="#a8916a"/><rect x="425" y="129" width="100" height="48" rx="9" fill="#f3e7c9"/><rect class="lit" opacity="0" style="animation-delay:3.6s" x="425" y="129" width="100" height="48" rx="9" fill="#ffcf7a"/><text x="475" y="160.2" font-size="20" fill="#2a1e14" text-anchor="middle" font-weight="normal">Shift</text></g><rect x="585" y="135" width="165" height="62" rx="12" fill="#050a07" opacity=".6"/><g class="key" style="animation-delay:4.6s"><rect x="585" y="126" width="165" height="62" rx="12" fill="#a8916a"/><rect x="590" y="129" width="155" height="48" rx="9" fill="#f3e7c9"/><rect class="lit" opacity="0" style="animation-delay:4.6s" x="590" y="129" width="155" height="48" rx="9" fill="#ffcf7a"/><text x="667.5" y="160.2" font-size="20" fill="#2a1e14" text-anchor="middle" font-weight="normal">Space</text></g><rect x="805" y="135" width="62" height="62" rx="12" fill="#050a07" opacity=".6"/><g class="key" style="animation-delay:5.6s"><rect x="805" y="126" width="62" height="62" rx="12" fill="#a8916a"/><rect x="810" y="129" width="52" height="48" rx="9" fill="#f3e7c9"/><rect class="lit" opacity="0" style="animation-delay:5.6s" x="810" y="129" width="52" height="48" rx="9" fill="#ffcf7a"/><text x="836" y="161.6" font-size="24" fill="#2a1e14" text-anchor="middle" font-weight="normal">T</text></g><rect x="920" y="135" width="62" height="62" rx="12" fill="#050a07" opacity=".6"/><g class="key" style="animation-delay:6.6s"><rect x="920" y="126" width="62" height="62" rx="12" fill="#a8916a"/><rect x="925" y="129" width="52" height="48" rx="9" fill="#f3e7c9"/><rect class="lit" opacity="0" style="animation-delay:6.6s" x="925" y="129" width="52" height="48" rx="9" fill="#ffcf7a"/><text x="951" y="161.6" font-size="24" fill="#2a1e14" text-anchor="middle" font-weight="normal">F</text></g><rect x="1035" y="135" width="62" height="62" rx="12" fill="#050a07" opacity=".6"/><g class="key" style="animation-delay:7.6s"><rect x="1035" y="126" width="62" height="62" rx="12" fill="#a8916a"/><rect x="1040" y="129" width="52" height="48" rx="9" fill="#f3e7c9"/><rect class="lit" opacity="0" style="animation-delay:7.6s" x="1040" y="129" width="52" height="48" rx="9" fill="#ffcf7a"/><text x="1066" y="161.6" font-size="24" fill="#2a1e14" text-anchor="middle" font-weight="normal">J</text></g><rect x="1150" y="135" width="62" height="62" rx="12" fill="#050a07" opacity=".6"/><g class="key" style="animation-delay:8.6s"><rect x="1150" y="126" width="62" height="62" rx="12" fill="#a8916a"/><rect x="1155" y="129" width="52" height="48" rx="9" fill="#f3e7c9"/><rect class="lit" opacity="0" style="animation-delay:8.6s" x="1155" y="129" width="52" height="48" rx="9" fill="#ffcf7a"/><text x="1181" y="161.6" font-size="24" fill="#2a1e14" text-anchor="middle" font-weight="normal">M</text></g><text x="141" y="248" font-size="25" fill="#ffcf7a" text-anchor="middle" font-weight="normal">Walk</text><text x="141" y="280" font-size="19" fill="#f3e7c9" text-anchor="middle" font-weight="normal" opacity="0.85">or the arrow keys</text><text x="331" y="248" font-size="25" fill="#ffcf7a" text-anchor="middle" font-weight="normal">Use</text><text x="331" y="280" font-size="19" fill="#f3e7c9" text-anchor="middle" font-weight="normal" opacity="0.85">hold to gather</text><text x="475" y="248" font-size="25" fill="#ffcf7a" text-anchor="middle" font-weight="normal">Run</text><text x="475" y="280" font-size="19" fill="#f3e7c9" text-anchor="middle" font-weight="normal" opacity="0.85">costs food</text><text x="667.5" y="248" font-size="25" fill="#ffcf7a" text-anchor="middle" font-weight="normal">Flare</text><text x="667.5" y="280" font-size="19" fill="#f3e7c9" text-anchor="middle" font-weight="normal" opacity="0.85">burns oil fast</text><text x="836" y="248" font-size="25" fill="#ffcf7a" text-anchor="middle" font-weight="normal">Torch</text><text x="836" y="280" font-size="19" fill="#f3e7c9" text-anchor="middle" font-weight="normal" opacity="0.85">plant one</text><text x="951" y="248" font-size="25" fill="#ffcf7a" text-anchor="middle" font-weight="normal">Eat</text><text x="951" y="280" font-size="19" fill="#f3e7c9" text-anchor="middle" font-weight="normal" opacity="0.85">from your pack</text><text x="1066" y="248" font-size="25" fill="#ffcf7a" text-anchor="middle" font-weight="normal">Journal</text><text x="1066" y="280" font-size="19" fill="#f3e7c9" text-anchor="middle" font-weight="normal" opacity="0.85">pages</text><text x="1181" y="248" font-size="25" fill="#ffcf7a" text-anchor="middle" font-weight="normal">Sound</text><text x="1181" y="280" font-size="19" fill="#f3e7c9" text-anchor="middle" font-weight="normal" opacity="0.85">on / off</text><rect x="1" y="1" width="1278" height="318" rx="21" fill="none" stroke="#ffcf7a" stroke-opacity=".28" stroke-width="2"/></svg>