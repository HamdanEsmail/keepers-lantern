<svg xmlns="http://www.w3.org/2000/svg" width="420" height="84" viewBox="0 0 420 84" role="img" aria-label="Play it in your browser"><title>Play it in your browser</title><style>
text{font-family:Georgia, 'Times New Roman', serif}
.sway{transform-box:fill-box;transform-origin:50% 92%;animation:sway 4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
.flick{transform-box:fill-box;transform-origin:center;animation:flick .9s ease-in-out infinite alternate}
.flick2{transform-box:fill-box;transform-origin:center;animation:flick 1.3s ease-in-out infinite alternate-reverse}
@keyframes flick{from{transform:scale(.965)}to{transform:scale(1.035)}}
.flame{transform-box:fill-box;transform-origin:50% 80%;animation:flame .32s ease-in-out infinite alternate}
@keyframes flame{from{transform:scaleY(.95) scaleX(1.02)}to{transform:scaleY(1.05) scaleX(.98)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.ff{animation:ff 6s ease-in-out infinite}
@keyframes ff{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}50%{opacity:.25;transform:translate(14px,-18px)}80%{opacity:1;transform:translate(-8px,-30px)}100%{opacity:0;transform:translate(4px,-44px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.8}}</style><defs><linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6ecd3"/><stop offset="1" stop-color="#e3cfa2"/></linearGradient><filter id="halo" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="6"/></filter></defs><rect class="pulse" x="10" y="10" width="400" height="64" rx="32" fill="#ffcf7a" filter="url(#halo)"/><rect x="10" y="12" width="400" height="62" rx="31" fill="#8a5a34"/><rect x="10" y="9" width="400" height="60" rx="30" fill="url(#paper)" stroke="#b8653c" stroke-width="2"/><g transform="translate(58 39)"><circle r="15" fill="#ffcf7a" opacity=".35" class="pulse"/><path d="M-6 -11 Q0 -19 6 -11" fill="none" stroke="#5a3f2a" stroke-width="2"/><path d="M-9 -8 L-7 -11 L7 -11 L9 -8 Z" fill="#5a3f2a"/><rect x="-7" y="-8" width="14" height="15" rx="2" fill="#ffcf7a"/><rect x="-2.5" y="-5" width="5" height="9" rx="2.5" fill="#fff1b8"/><rect x="-9" y="7" width="18" height="4" rx="1.5" fill="#5a3f2a"/></g><text x="232" y="48" font-size="27" fill="#2a1e14" text-anchor="middle" font-weight="normal">Play it in your browser</text></svg>